[project]
name = "bti-assistant"
version = "0.2.0"
description = "A classification assistant for EU customs decisions: retrieval-augmented generation and a small tool-calling agent (Session 15)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "openai>=1.40",
    "duckdb>=1.1",
]

[project.optional-dependencies]
# real embeddings (downloads intfloat/multilingual-e5-small, about 470 MB, on first use)
embeddings = ["sentence-transformers>=3.0"]
# the course path: PostgreSQL with the pgvector extension
postgres = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
# loading the case-study parquet files
data = ["pandas>=2.2", "pyarrow>=16"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bti_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
