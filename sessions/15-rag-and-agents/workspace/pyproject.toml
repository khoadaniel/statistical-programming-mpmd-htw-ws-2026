[project]
name = "bti-assistant"
version = "0.2.0"
description = "A classification assistant for EU customs decisions: retrieval-augmented generation and a small tool-calling agent (Session 15)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5",
    "openai>=3.28",
]

[project.optional-dependencies]
# real embeddings (downloads intfloat/multilingual-e5-small, about 470 MB, on first use)
embeddings = ["sentence-transformers>=6.1"]
# loading the case-study parquet files
data = ["pandas>=3.0", "pyarrow>=26.0", "openpyxl>=3.1.5"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bti_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
