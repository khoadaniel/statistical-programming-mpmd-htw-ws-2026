[project]
name = "sentiment-service"
version = "1.0.0"
description = "Review sentiment classifier served as a tested web API, with drift monitoring (Session 16)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=16",
]

[project.optional-dependencies]
# safer model files than pickle/joblib (https://skops.readthedocs.io)
skops = ["skops>=0.10"]
# the demo dashboard in dashboard/streamlit_app.py
dashboard = ["streamlit>=1.36"]

[dependency-groups]
dev = ["pytest", "ruff", "httpx2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentiment_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
