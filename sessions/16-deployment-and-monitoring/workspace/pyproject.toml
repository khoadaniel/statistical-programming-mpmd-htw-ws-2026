[project]
name = "tariff-service"
version = "1.0.0"
description = "HS heading suggestions for customs decisions, served as a tested web API, with drift monitoring (Session 16)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143",
    "pydantic>=2.14",
    "uvicorn>=0.54",
    "scikit-learn>=1.9",
    "joblib>=1.6",
    "numpy>=2.5",
    "scipy>=1.18",
    "pandas>=3.0",
    "pyarrow>=25.0",
]

[project.optional-dependencies]
# safer model files than pickle/joblib (https://skops.readthedocs.io)
skops = ["skops>=0.16"]
# the demo dashboard in dashboard/streamlit_app.py
dashboard = ["streamlit>=1.65"]

[dependency-groups]
dev = ["pytest", "ruff", "httpx2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tariff_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
