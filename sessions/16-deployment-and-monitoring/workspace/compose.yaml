# A data application in two containers: front end (dashboard) and back end (prediction API). The database is a
# SQLite file on the volume prediction-data, which only the API container mounts.
#   docker compose up --build        then open http://localhost:8501 (dashboard) and http://localhost:8000/docs (API)
#   docker compose down              stops everything; add -v to delete the volume with the prediction log as well
# The model files must be in models/ before the build (see README). Inside the compose network the services
# reach each other by name: the dashboard calls http://api:8000.
services:
  api:
    build: .
    environment:
      PREDICTION_DB: /app/data/predictions.sqlite   # every prediction is logged to this SQLite file
    volumes:
      - prediction-data:/app/data                   # the log survives a restart of the container
    ports:
      - "8000:8000"

  dashboard:
    build: dashboard
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy              # the API's Dockerfile defines a HEALTHCHECK
    ports:
      - "8501:8501"

volumes:
  prediction-data:
