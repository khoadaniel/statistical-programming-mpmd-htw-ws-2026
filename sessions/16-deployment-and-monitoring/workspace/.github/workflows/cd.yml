# Continuous delivery (example): when a version tag such as v1.0.0 is pushed, build the image with the
# released model and push it to the GitHub container registry (ghcr.io/<owner>/<repo>:1.0.0).
#
# Release procedure:
#   1. train:   uv run python -m tariff_service.train --data ... --version 1.0.0
#   2. release: gh release create v1.0.0 models/model.joblib models/metadata.json --notes "model card: ..."
#   3. the tag triggers this workflow; the image is then pulled by the hosting platform.
# The model files are attached to the release because the training data may not be redistributed and
# model files do not belong in Git history.
name: cd
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  release-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download the model files of this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${GITHUB_REF_NAME}" --pattern "model.joblib" --pattern "metadata.json" --dir models
      - name: Check that the model version matches the tag
        run: |
          python3 -c "import json,sys; v=json.load(open('models/metadata.json'))['model_version']; \
                      sys.exit(0 if 'v'+v == '${GITHUB_REF_NAME}' else 'metadata version '+v+' != tag')"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Deployment depends on the platform. Examples (each needs its own credentials as repository secrets):
      #   Render:          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
      #   Google Cloud Run: google-github-actions/deploy-cloudrun with the image ghcr.io/... mirrored to Artifact Registry
