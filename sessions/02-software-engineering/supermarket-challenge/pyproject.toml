[project]
name = "supermarket"
version = "0.1.0"
description = "HTW Markt, a small supermarket in plain Python classes: the code challenge of Session 2"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0",  # reads the YAML files in data/ (baskets and deliveries)
]

# Terminal commands: `htw-checkout` calls the function `checkout_main` in the module `supermarket.cli`.
[project.scripts]
htw-checkout = "supermarket.cli:checkout_main"
htw-shelves = "supermarket.cli:shelves_main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.17"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
