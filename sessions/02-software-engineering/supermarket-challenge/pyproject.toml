[project]
name = "supermarket"
version = "0.1.0"
description = "HTW Markt, a small supermarket in plain Python classes: the code challenge of Session 2"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0",  # reads the YAML files in data/: the catalogue and the baskets
]

# The terminal command `htw-checkout` calls the function `checkout_main` in the module `supermarket.cli`.
[project.scripts]
htw-checkout = "supermarket.cli:checkout_main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.17"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-rs"  # list every task that is not started yet
markers = ["task(number): a test that checks your work on one task"]

[tool.ruff]
line-length = 100
