[project]
name = "statistical-programming"
version = "2026.10"
description = "Course environment for Statistical Programming: Data Analytics and Machine Learning in Python (MPMD, HTW Berlin)"
requires-python = ">=3.11,<3.14"
dependencies = [
    # notebooks
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    # data
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "polars>=1.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "duckdb>=1.0",
    "duckdb-engine>=0.13",
    "jupysql>=0.10",
    # visualisation and reporting
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
    "streamlit>=1.35",
    # statistics and machine learning
    "scipy>=1.12",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "imbalanced-learn>=0.12",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "catboost>=1.2",
    "shap>=0.45",
    "umap-learn>=0.5",
    "pandera>=0.20",
    # time series (Session 12)
    "statsforecast>=2.0",
    "mlforecast>=1.0",
    "utilsforecast>=0.2",
    # text (Sessions 13-14)
    "nltk>=3.8",
    "tiktoken>=0.7",
    # software engineering and deployment
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "joblib>=1.3",
    "skops>=0.10",
    "pgvector>=0.3",
    # language models
    "openai>=1.30",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "nbformat>=5.10", "nbclient>=0.10", "httpx2>=2.0"]
# packages needed by single third-party notebooks only: uv sync --group extras
extras = ["empiricaldist", "statadict", "nhanes", "colorspacious", "scikit-image", "gdown", "python-dotenv", "hyperopt", "evidently"]
# these need PyTorch (about 1 GB): embedding models for Sessions 14-15, and the ISLP labs
embeddings = ["sentence-transformers>=3.0"]
islp = ["ISLP>=0.4"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
extend-exclude = ["sessions/*/workbooks"]
