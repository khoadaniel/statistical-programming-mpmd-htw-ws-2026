[project]
name = "statistical-programming"
version = "2026.10"
description = "Course environment for Statistical Programming: Data Analytics and Machine Learning in Python (MPMD, HTW Berlin)"
requires-python = ">=3.14,<3.15"
dependencies = [
    # notebooks
    "jupyterlab>=4.6",
    "ipykernel>=7.4",
    # data
    "numpy>=2.5",
    "pandas>=3.0",
    "pyarrow>=25.0",
    "polars>=2.0",  # used by a few third-party extras and the scikit-learn gallery example in Session 12; not taught
    "sqlalchemy>=2.1",  # SQL databases from Python (Session 15 extras); the course database is SQLite (sqlite3)
    # visualisation and reporting
    "matplotlib>=3.11",
    "seaborn>=0.13",
    "plotly>=7.1",
    "streamlit>=1.65",
    # statistics and machine learning
    "scipy>=1.18",
    "statsmodels>=0.15",
    "scikit-learn>=1.9",
    "imbalanced-learn>=0.14",
    "xgboost>=3.4; sys_platform != 'linux'",
    "xgboost-cpu>=3.4; sys_platform == 'linux'",  # same library without the NVIDIA GPU runtime (216 MB)
    "lightgbm>=4.7",
    "catboost>=1.2",
    "shap>=0.53",
    "umap-learn>=0.5",
    "skrub>=0.11",
    # used by core third-party notebooks (Think Stats, statsthinking21, Data 100, Plotly gallery)
    "empiricaldist>=0.10",
    "statadict>=1.1",
    "nhanes>=0.5",
    "setuptools<81",  # nhanes still imports pkg_resources, removed in setuptools 81
    "scikit-image>=0.26",
    "gdown>=6.4",
    "pandera>=0.34",
    # text (Sessions 13-14)
    "nltk>=3.10",
    "tiktoken>=0.14",
    # software engineering and deployment
    "httpx>=0.28",
    "fastapi>=0.143",
    "uvicorn>=0.54",
    "pydantic>=2.14",
    "joblib>=1.6",
    "skops>=0.16",
    # language models: embedding models (Sessions 14-15) need PyTorch; on Linux the CPU-only build is used (see below)
    "openai>=3.28",
    "torch>=2.14",
    "sentence-transformers>=6.1",
    # packages needed by single third-party notebooks (extras and the ISLP labs)
    "colorspacious>=1.1",
    "python-dotenv>=1.0",
    "hyperopt>=0.2",
    "ISLP>=0.4",
    "l0bnb>=1.0",
    "rank-bm25>=0.2",
    "openpyxl>=3.1.5",
]

[project.scripts]
check_setup = "course_tools.check_setup:main"  # uv run check_setup: is this laptop ready? (GETTING_STARTED.md)

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.17", "nbformat>=5.11", "nbclient>=0.11", "httpx2>=2.13"]
# Not in the course environment because they need an older Plotly or pandas:
#   Session 16 extras 01 (Evidently needs Plotly < 6) and Session 12 extras 02, 05, 06 (StatsForecast and
#   MLForecast need pandas < 3); the session READMEs give the `uv run --no-project --with ... jupyter lab` command.

[tool.uv]
package = true  # installs the small course_tools package, so that `uv run check_setup` works

[tool.uv.build-backend]
module-name = "course_tools"
module-root = ""

# PyTorch from PyPI includes NVIDIA GPU libraries on Linux (about 3 GB). Laptops do not need them, so Linux uses the
# CPU-only build from the PyTorch index; macOS and Windows get CPU builds from PyPI anyway.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
extend-exclude = ["sessions/*/workbooks"]
